series:
  - KXBTC15M

# Display tiers. Execution separately enforces the immutable 20-point minimum.
tiers:
  high_pp: 25.0
  medium_pp: 20.0
  low_pp: 20.0
  tight_spread_cents: 3.0   # max yes ask-bid for HIGH tier
  min_book_usd: 25.0

# Cross-venue arb: Kalshi UP + Polymarket DOWN (or inverse) < threshold
cross_venue:
  enabled: false
  max_pair_cost: 0.99
  min_edge_usd: 0.01
  order_size: 5

spot_lag:
  enabled: false
  min_spot_move_usd: 50
  lookback_seconds: 30
  min_implied_lag: 0.03
  min_edge: 0.20
  poll_interval_sec: 1.0

orderbook_skew:
  enabled: false
  top_levels: 5
  max_seconds_remaining: 180
  min_skew: 0.25
  min_z_distance: 1.5
  min_edge: 0.20

mean_reversion:
  enabled: false
  cheap_threshold: 0.20
  rich_threshold: 0.80
  maker_offset_cents: 0.01
  revert_exit_cents: 0.15
  max_resting_orders: 2
  time_in_force: good_til_canceled

agents:
  enabled: false
  min_edge: 0.03
  momentum_weight: 0.5
  skew_weight: 0.5

intelligence:
  enabled: false

execution:
  dry_run: false
  orders_enabled: true
  max_position_usd: 50
  max_contracts_per_trade: 25
  min_trade_notional_usd: 0
  poll_interval_sec: 5.0
  only_tiers: ["HIGH", "MEDIUM"]
  fee_rate: 0.0
  fee_per_contract: 0.0
  slippage_bps: 5.0
  slippage_per_contract: 0.0

longshot:
  enabled: false
  max_entry_price: 0.45
  min_edge: 0.06
  min_confidence: 0.0
  min_signal_agreement: 0.48
  poll_enabled: false
  require_forecast_alignment: false
  position_size_mult: 0.5
  take_profit_cents: 0.06
  take_profit_pct: 0.10
  take_profit_price: 0.55
  stop_loss_cents: 0.07
  stop_loss_pct: 0.10
  time_stop_seconds: 900
  reversal_cents: 0.05
  reversal_window_seconds: 120
  entry_window_seconds: 900
  follow_extreme_poll: false
  extreme_poll_threshold: 0.85
  extreme_poll_late_seconds: 0
  extreme_favorite_max_price: 0.85
  extreme_poll_min_model_prob: 0.48
  favorite_only: false
  perfect_entry_only: false
  late_crowd_follow_seconds: 0
  late_crowd_poll_threshold: 0.84
  late_crowd_min_model_prob: 0.50
  late_crowd_confirm_threshold: 0.50
  late_crowd_favorite_max_price: 0.86
  late_crowd_require_strike_hold: false
  late_crowd_min_hold_probability: 0.50
  late_crowd_max_z_against: 1.0

strategy:
  contract_duration_seconds: 900
  min_edge: 0.20
  target_edge: 0.20
  min_confidence: 0.0
  min_signal_agreement: 0.48
  min_data_completeness: 0.75
  max_spread: 0.12
  min_seconds_remaining: 60
  max_entry_seconds_remaining: 900
  late_seconds: 120
  final_seconds: 60
  final_min_edge: 0.20
  late_favorite_seconds: 420
  late_favorite_poll_threshold: 0.78
  late_favorite_min_edge: 0.04
  min_entry_executable_cost: 0.08
  order_quantity: 1
  min_trade_quality_score: 65
  max_do_not_trade_score: 40
  require_trade_quality: true
  min_pattern_matches: 10
  external_data_enabled: false
  entry_signal_persistence_polls: 3
  chop_zone_min_sigma: 0.35
  require_orderbook_depth: false
  window_regime_enabled: true

poll:
  mode: disabled
  favorable_min: 0.85
  favorable_max: 0.90
  low_poll_threshold: 0.85
  counter_evidence_min_probability: 0.70
  counter_evidence_min_confidence: 0.65
  counter_evidence_min_agreement: 0.65
  low_poll_min_probability: 0.72
  low_poll_min_confidence: 0.68
  low_poll_min_agreement: 0.68

risk:
  max_daily_loss: 100
  max_contract_exposure: 25
  max_position_size: 50
  max_consecutive_losses: 4
  max_trades_per_contract: 1
  max_flips_per_contract: 0
  cooldown_seconds: 300
  min_hold_seconds: 120
  position_reversal_enabled: true
  position_reversal_window_seconds: 420
  position_reversal_min_hold_probability: 0.50
  position_reversal_late_hold_probability: 0.62
  position_reversal_min_z_support: -0.30
  position_reversal_wrong_side_seconds: 120
  position_reversal_min_forecast_probability: 0.48
  kelly_enabled: true
  kelly_fraction: 0.25
  kelly_max_fraction: 0.25
  stop_loss_fraction: 0.55
  opposite_edge_shift: 0.25
  thesis_reversal_enabled: false
  opposite_edge_exit_enabled: false
  recovery_hold_enabled: false
  recovery_hold_min_probability: 0.58
  recovery_hold_min_confidence: 0.58
  recovery_hold_min_agreement: 0.58

data:
  benchmark_mode: kalshi_passthrough
  cf_benchmark_url: ""
  cf_benchmark_api_key: ""
  cf_benchmark_api_key_header: Authorization
  cf_benchmark_api_key_prefix: Bearer
  max_brti_age_seconds: 15
  min_supporting_venues: 2
  max_supporting_dispersion: 0.003

pricing:
  risk_free_rate: 0.05
  min_iv: 0.30
  max_iv: 1.50
  default_iv: 0.60
  smile_cache_sec: 60

settlement:
  reference: BRTI
  proxy_symbol: ""
