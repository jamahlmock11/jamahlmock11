series:
  - KXBTC15M

# Display tiers. Execution separately enforces the immutable 20-point minimum.
tiers:
  high_pp: 25.0
  medium_pp: 20.0
  low_pp: 20.0
  tight_spread_cents: 3.0   # max yes ask-bid for HIGH tier
  min_book_usd: 25.0

# Cross-venue arb: Kalshi UP + Polymarket DOWN (or inverse) < threshold
cross_venue:
  enabled: false
  max_pair_cost: 0.99
  min_edge_usd: 0.01
  order_size: 5

lag_reversal:
  enabled: true
  entry_enabled: false
  suppress_forecast_entries: false
  min_entry_score: 70
  watch_score: 50
  strong_score: 85
  min_edge: 0.10
  min_reversal_probability: 0.40
  min_probability_change: 0.10
  min_kalshi_lag: 0.08
  min_initial_move_z: 0.50
  min_seconds_remaining: 120
  max_seconds_remaining: 600
  require_cross_feed_confirm: true
  min_cross_venue_agreement: 0.50
  order_quantity: 1

spot_lag:
  enabled: false
  min_spot_move_usd: 50
  lookback_seconds: 30
  min_implied_lag: 0.03
  min_edge: 0.20
  poll_interval_sec: 1.0

orderbook_skew:
  enabled: false
  top_levels: 5
  max_seconds_remaining: 180
  min_skew: 0.25
  min_z_distance: 1.5
  min_edge: 0.20

mean_reversion:
  enabled: false
  cheap_threshold: 0.20
  rich_threshold: 0.80
  maker_offset_cents: 0.01
  revert_exit_cents: 0.15
  max_resting_orders: 2
  time_in_force: good_til_canceled

agents:
  enabled: false
  min_edge: 0.03
  momentum_weight: 0.5
  skew_weight: 0.5

intelligence:
  enabled: false

execution:
  dry_run: true
  orders_enabled: false
  max_position_usd: 1.50
  max_contracts_per_trade: 25
  min_trade_notional_usd: 0
  poll_interval_sec: 10.0
  only_tiers: ["HIGH", "MEDIUM"]
  fee_rate: 0.0
  fee_per_contract: 0.0
  slippage_bps: 5.0
  slippage_per_contract: 0.0

longshot:
  enabled: false
  max_entry_price: 0.45
  min_edge: 0.06
  min_confidence: 0.0
  min_signal_agreement: 0.48
  poll_enabled: false
  require_forecast_alignment: false
  position_size_mult: 0.5
  take_profit_cents: 0.06
  take_profit_pct: 0.10
  take_profit_price: 0.55
  stop_loss_cents: 0.07
  stop_loss_pct: 0.10
  time_stop_seconds: 900
  reversal_cents: 0.05
  reversal_window_seconds: 120
  entry_window_seconds: 900
  follow_extreme_poll: true
  extreme_poll_threshold: 0.80
  extreme_poll_late_seconds: 0
  extreme_favorite_max_price: 0.85
  crowd_follow_price_band_cents: 0.03
  extreme_poll_min_model_prob: 0.48
  favorite_only: false
  perfect_entry_only: false
  late_crowd_follow_seconds: 0
  late_crowd_poll_threshold: 0.84
  late_crowd_min_model_prob: 0.50
  late_crowd_confirm_threshold: 0.50
  late_crowd_favorite_max_price: 0.86
  late_crowd_require_strike_hold: false
  late_crowd_min_hold_probability: 0.50
  late_crowd_max_z_against: 1.0

strategy:
  contract_duration_seconds: 900
  min_edge: 0.15
  target_edge: 0.15
  min_confidence: 0.0
  min_signal_agreement: 0.55
  setup_score_enabled: true
  setup_score_weight: 0.30
  entry_sweet_spot_min_seconds: 180
  entry_sweet_spot_max_seconds: 600
  min_setup_score: 0
  require_setup_score: false
  min_data_completeness: 0.65
  max_spread: 0.07
  min_seconds_remaining: 60
  max_entry_seconds_remaining: 900
  late_seconds: 360
  final_seconds: 360
  final_min_edge: 0.15
  late_confidence_increment: 0.10
  late_favorite_seconds: 420
  late_favorite_poll_threshold: 0.80
  late_favorite_min_edge: 0.04
  order_quantity: 1
  min_trade_quality_score: 70
  max_do_not_trade_score: 40
  require_trade_quality: false
  min_pattern_matches: 0
  external_data_enabled: false
  entry_signal_persistence_polls: 1
  chop_zone_min_sigma: 0.0
  require_orderbook_depth: true
  window_regime_enabled: true

poll:
  mode: disabled

risk:
  max_daily_loss: 100
  max_contract_exposure: 1.50
  max_position_size: 1.50
  max_consecutive_losses: 4
  max_trades_per_contract: 3
  max_flips_per_contract: 2
  cooldown_seconds: 0
  allow_pyramiding: false
  min_hold_seconds: 120
  position_reversal_enabled: false
  position_reversal_window_seconds: 420
  position_reversal_min_hold_probability: 0.50
  position_reversal_late_hold_probability: 0.62
  position_reversal_min_z_support: -0.30
  position_reversal_wrong_side_seconds: 120
  position_reversal_min_forecast_probability: 0.48
  kelly_enabled: false
  kelly_fraction: 0.25
  kelly_max_fraction: 0.25
  kelly_bankroll_usd: 16.22
  stop_loss_fraction: 0.40
  stop_loss_require_thesis_failure: true
  stop_loss_min_hold_probability: 0.48
  stop_loss_min_agreement: 0.50
  take_profit_capture_fraction: 0.60
  hold_to_expiry_enabled: true
  hold_to_expiry_min_probability: 0.58
  hold_to_expiry_min_confidence: 0.58
  hold_to_expiry_min_agreement: 0.58
  opposite_edge_shift: 0.25
  thesis_reversal_enabled: true
  thesis_reversal_margin: 0.10
  opposite_edge_exit_enabled: true
  recovery_hold_enabled: false
  recovery_hold_min_probability: 0.58
  recovery_hold_min_confidence: 0.58
  recovery_hold_min_agreement: 0.58

data:
  benchmark_mode: kalshi_passthrough
  cf_benchmark_url: ""
  cf_benchmark_api_key: ""
  cf_benchmark_api_key_header: Authorization
  cf_benchmark_api_key_prefix: Bearer
  max_brti_age_seconds: 10
  min_supporting_venues: 2
  max_supporting_dispersion: 0.003

pricing:
  risk_free_rate: 0.05
  min_iv: 0.30
  max_iv: 1.50
  default_iv: 0.60
  smile_cache_sec: 60

settlement:
  reference: BRTI
  proxy_symbol: ""
