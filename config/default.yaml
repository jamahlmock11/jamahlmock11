series:
  - KXBTC15M

# ── Strategies (all off — enable and tune below) ──────────────────────────────

lag_reversal:
  enabled: false

spot_lag:
  enabled: false

orderbook_skew:
  enabled: false
  ensemble_enabled: false

mean_reversion:
  enabled: false

cross_venue:
  enabled: false

longshot:
  enabled: false

agents:
  enabled: false

intelligence:
  enabled: false

poll:
  mode: disabled

# ── Entry rules (blank — add your thresholds below) ─────────────────────────

strategy:
  mispricing_enabled: false
  dynamic_edge_enabled: false
  setup_score_enabled: false
  window_regime_enabled: false
  require_orderbook_depth: false
  require_trade_quality: false
  pattern_matching_enabled: false
  min_edge: 0.11
  min_confidence: 0.0
  min_signal_agreement: 0.0
  min_data_completeness: 0.0
  min_seconds_remaining: 0
  max_entry_seconds_remaining: 900
  late_seconds: 0
  final_seconds: 0
  late_favorite_seconds: 0
  max_spread: 1.0
  min_entry_executable_cost: 0.0
  entry_signal_persistence_polls: 1
  chop_zone_min_sigma: 0.0
  order_quantity: 1

tiers:
  high_pp: 25.0
  medium_pp: 20.0
  low_pp: 20.0
  tight_spread_cents: 3.0
  min_book_usd: 25.0

execution:
  dry_run: false
  orders_enabled: true
  max_position_usd: 1.50
  max_contracts_per_trade: 25
  min_trade_notional_usd: 0
  poll_interval_sec: 10.0
  only_tiers: ["HIGH", "MEDIUM"]
  fee_rate: 0.0
  fee_per_contract: 0.0
  slippage_bps: 5.0
  slippage_per_contract: 0.0

risk:
  max_daily_loss: 100
  max_contract_exposure: 1.50
  max_position_size: 1.50
  max_consecutive_losses: 4
  max_trades_per_contract: 1
  max_flips_per_contract: 0
  cooldown_seconds: 300
  min_hold_seconds: 60
  kelly_enabled: false
  position_reversal_enabled: false
  thesis_reversal_enabled: false
  opposite_edge_exit_enabled: false
  recovery_hold_enabled: false

data:
  benchmark_mode: kalshi_passthrough
  cf_benchmark_url: ""
  cf_benchmark_api_key: ""
  cf_benchmark_api_key_header: Authorization
  cf_benchmark_api_key_prefix: Bearer
  max_brti_age_seconds: 10
  min_supporting_venues: 2
  max_supporting_dispersion: 0.003

pricing:
  risk_free_rate: 0.05
  min_iv: 0.30
  max_iv: 1.50
  default_iv: 0.60
  smile_cache_sec: 60

settlement:
  reference: BRTI
  proxy_symbol: ""
