series:
  - KXBTC15M

# Display tiers. Execution separately enforces the immutable 20-point minimum.
tiers:
  high_pp: 25.0
  medium_pp: 20.0
  low_pp: 20.0
  tight_spread_cents: 3.0   # max yes ask-bid for HIGH tier
  min_book_usd: 25.0

# Cross-venue arb: Kalshi UP + Polymarket DOWN (or inverse) < threshold
cross_venue:
  enabled: false  # off live until Polymarket leg is automated (avoids unpaired Kalshi risk)
  max_pair_cost: 0.99   # risk-free if combined ask < 1.00; 0.99 leaves buffer
  min_edge_usd: 0.01
  order_size: 5

execution:
  dry_run: false
  orders_enabled: true
  max_position_usd: 50
  max_contracts_per_trade: 25
  min_trade_notional_usd: 0
  poll_interval_sec: 5.0
  only_tiers: ["HIGH", "MEDIUM"]
  fee_rate: 0.0
  fee_per_contract: 0.0
  slippage_bps: 5.0
  slippage_per_contract: 0.0

strategy:
  min_edge: 0.20       # cannot be configured below 0.20
  target_edge: 0.25
  min_confidence: 0.58
  min_signal_agreement: 0.58
  min_data_completeness: 0.75
  max_spread: 0.12
  min_seconds_remaining: 30
  # Only enter in the final 10 minutes of each 15-minute contract.
  max_entry_seconds_remaining: 600
  late_seconds: 120
  final_seconds: 60
  final_min_edge: 0.25
  order_quantity: 1

poll:
  favorable_min: 0.85
  favorable_max: 0.90
  low_poll_threshold: 0.85
  counter_evidence_min_probability: 0.70
  counter_evidence_min_confidence: 0.65
  counter_evidence_min_agreement: 0.65
  low_poll_min_probability: 0.72
  low_poll_min_confidence: 0.68
  low_poll_min_agreement: 0.68

risk:
  max_daily_loss: 100
  max_contract_exposure: 25
  max_position_size: 50
  max_consecutive_losses: 4
  max_trades_per_contract: 1
  max_flips_per_contract: 0
  cooldown_seconds: 300
  min_hold_seconds: 0
  stop_loss_fraction: 0.55
  opposite_edge_shift: 0.25
  thesis_reversal_enabled: true
  opposite_edge_exit_enabled: true
  recovery_hold_enabled: true
  recovery_hold_min_probability: 0.58
  recovery_hold_min_confidence: 0.58
  recovery_hold_min_agreement: 0.58

data:
  # constituent_proxy is an explicitly unofficial PAPER-only estimate built
  # from public CME CF constituent venues. Use official for LIVE eligibility.
  benchmark_mode: kalshi_passthrough
  # Required when benchmark_mode=official. The proxy is never labelled BRTI
  # and can authorize PAPER decisions only.
  cf_benchmark_url: ""
  cf_benchmark_api_key: ""
  cf_benchmark_api_key_header: Authorization
  cf_benchmark_api_key_prefix: Bearer
  max_brti_age_seconds: 15
  min_supporting_venues: 2
  max_supporting_dispersion: 0.003

pricing:
  risk_free_rate: 0.05
  # IBIT ↔ BTC translation uses live price ratio (IBIT/BTC)
  # Short-tenor IV is extrapolated from the nearest IBIT smile via sqrt-time
  min_iv: 0.30
  max_iv: 1.50
  default_iv: 0.60   # fallback if smile unavailable (BTC high-vol regime)
  smile_cache_sec: 60

settlement:
  # Kalshi settles on the 60-second average of CF Benchmarks BRTI.
  reference: BRTI
  proxy_symbol: ""