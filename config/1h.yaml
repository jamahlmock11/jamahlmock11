horizon: 1h
series:
  - KXBTCD

# 1-hour contract metadata (discovery + feature history)
hour:
  series_ticker: KXBTCD
  market_type: 1h
  contract_duration_seconds: 3600
  min_seconds_remaining: 60
  max_entry_seconds_remaining: 2400
  late_window_seconds: 2400
  mid_window_seconds: 1800
  final_seconds: 60
  history_seconds: 3700
  min_confidence: 0.0
  min_signal_agreement: 0.60
  min_data_completeness: 0.65
  max_spread: 0.07
  order_quantity: 1
  poll_interval_sec: 10
  model_version: hour-reversal-v1
  require_forecast_alignment: false
  forecast_alignment_min_probability: 0.65

# Reversal-only 1h strategy: momentum failure + Kalshi repricing lag.
hour_reversal:
  enabled: true
  min_entry_edge: 0.15
  watch_score: 50
  min_reversal_score: 70
  strong_reversal_score: 85
  min_initial_trend_consistency: 0.55
  min_initial_move_strength: 0.0008
  min_probability_flip: 0.15
  min_kalshi_lag_cents: 0.08
  min_structure_break_score: 45
  min_model_change_score: 45
  min_kalshi_lag_score: 45
  min_reversal_side_probability: 0.38
  min_data_completeness: 0.65
  max_spread: 0.07
  min_seconds_remaining: 300
  max_entry_seconds_remaining: 2400
  require_cross_feed_confirmation: true
  min_cross_feed_score: 40

strategy:
  contract_duration_seconds: 3600
  min_edge: 0.15
  target_edge: 0.15
  min_confidence: 0.0
  min_signal_agreement: 0.60
  min_data_completeness: 0.65
  max_spread: 0.07
  min_seconds_remaining: 60
  max_entry_seconds_remaining: 2400
  late_seconds: 600
  final_seconds: 600
  order_quantity: 1
  require_orderbook_depth: false
  window_regime_enabled: true

longshot:
  enabled: false

poll:
  mode: disabled

intelligence:
  enabled: false

execution:
  dry_run: false
  orders_enabled: true
  max_position_usd: 50
  max_contracts_per_trade: 25
  min_trade_notional_usd: 0
  poll_interval_sec: 10.0
  fee_rate: 0.0
  fee_per_contract: 0.0
  slippage_bps: 5.0
  slippage_per_contract: 0.0

risk:
  max_daily_loss: 100
  max_contract_exposure: 25
  max_position_size: 50
  max_consecutive_losses: 4
  max_trades_per_contract: 1
  max_flips_per_contract: 0
  cooldown_seconds: 300
  min_hold_seconds: 120
  position_reversal_enabled: true
  position_reversal_window_seconds: 420
  position_reversal_min_hold_probability: 0.50
  position_reversal_late_hold_probability: 0.62
  position_reversal_min_z_support: -0.30
  position_reversal_wrong_side_seconds: 120
  position_reversal_min_forecast_probability: 0.48
  kelly_enabled: false
  kelly_fraction: 0.25
  kelly_max_fraction: 0.25
  kelly_bankroll_usd: 16.22
  stop_loss_fraction: 0.55
  opposite_edge_shift: 0.25
  thesis_reversal_enabled: false
  opposite_edge_exit_enabled: false
  recovery_hold_enabled: false
  recovery_hold_min_probability: 0.58
  recovery_hold_min_confidence: 0.58
  recovery_hold_min_agreement: 0.58

data:
  benchmark_mode: kalshi_passthrough
  cf_benchmark_url: ""
  max_brti_age_seconds: 10
  min_supporting_venues: 2
  max_supporting_dispersion: 0.003

pricing:
  risk_free_rate: 0.05
  min_iv: 0.30
  max_iv: 1.50
  default_iv: 0.60
  smile_cache_sec: 60

settlement:
  reference: BRTI
